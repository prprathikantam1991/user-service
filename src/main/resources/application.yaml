spring:
  application:
    name: user-service
  
  profiles:
    active: local  # Default to local profile

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
      # Note: Redis memory limits (maxmemory) and eviction policies (maxmemory-policy)
      # must be configured at the Redis server level, not in this application configuration.
      # See README.md for Redis server configuration instructions.

# CORS Configuration (common settings)
cors:
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Cache Configuration
cache:
  redis:
    # TTL (Time To Live) in milliseconds - entries expire after this duration
    time-to-live: 3600000  # 1 hour in milliseconds
    # User lookups do not cache missing identities; this avoids persisting
    # sentinel values and lets a newly provisioned user be visible immediately.
    cache-null-values: false
    # Note: Maximum entry count is NOT configured here. Unlike in-memory caches (Caffeine),
    # Redis memory limits must be set at the Redis server level using:
    # - maxmemory (e.g., 256mb)
    # - maxmemory-policy (e.g., allkeys-lru)
    # See README.md for detailed Redis server configuration.

# Authentication for trusted backend callers such as Auth Service.
# No default is provided: a missing value fails closed for /api/** requests.
security:
  internal-api-key: ${USER_SERVICE_API_KEY:}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
